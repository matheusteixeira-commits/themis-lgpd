[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-lgpd"
dynamic = ["version"]
description = "Anonimização de documentos públicos brasileiros (LGPD/LAI) sobre o Microsoft Presidio: nomes, CPF, CNPJ alfanumérico, PIS, CNH, título, CNS, processos e dados sensíveis, com tarja real em PDF, DOCX e planilhas — 100% local."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Gilson Maciel" }, { name = "Matheus Teixeira" }]
keywords = ["lgpd", "lai", "anonimização", "pii", "tarjamento", "privacidade", "brasil", "cpf", "redaction", "presidio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
]
dependencies = [
    "presidio-analyzer>=2.2.366,<2.3",
    "presidio-anonymizer>=2.2.366,<2.3",
    "spacy>=3.7,<3.9",
    "regex>=2024.4",
    "ftfy>=6.1",
]

[project.optional-dependencies]
arquivos = [
    "pdfplumber>=0.11.4",
    "pdfminer.six>=20251107",
    "pypdfium2>=4.30",
    "pikepdf>=9.0",
    "reportlab>=4.2",
    "pillow>=13.0.0",
    "python-docx>=1.1",
    "openpyxl>=3.1.5",
    "opencv-python-headless>=4.10",
]
ocr = ["rapidocr>=3.10", "onnxruntime>=1.20"]
api = ["fastapi>=0.163", "starlette>=1.3.1", "uvicorn[standard]>=0.32", "python-multipart>=0.0.33"]
ui = ["streamlit>=1.54", "pandas>=2.1", "streamlit-image-coordinates>=0.4.1"]
ml = ["presidio-analyzer[gliner]>=2.2.366,<2.3"]
completo = ["themis-lgpd[arquivos,ocr,api,ui]"]
dev = [
    "themis-lgpd[completo]",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "faker>=30",
    "pip-audit>=2.7",
    "bandit>=1.7.10",
    "segno>=1.6",
    "python-pptx>=1.0",
]

[project.scripts]
themis = "themis_lgpd.cli:main"

[project.urls]
Homepage = "https://github.com/matheusteixeira-commits/themis-lgpd"
Documentation = "https://github.com/matheusteixeira-commits/themis-lgpd/tree/main/docs"
Changelog = "https://github.com/matheusteixeira-commits/themis-lgpd/blob/main/CHANGELOG.md"
Source = "https://github.com/matheusteixeira-commits/themis-lgpd"
Issues = "https://github.com/matheusteixeira-commits/themis-lgpd/issues"

[tool.setuptools.dynamic]
version = { attr = "themis_lgpd._versao.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themis_lgpd = ["dados/*.txt", "dados/modelos/sensivel/*", "ui/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "lento: testes demorados (OCR, PDFs grandes)",
    "rede: testes que precisam de internet",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501", "S311", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"benchmark/**" = ["S"]

[tool.coverage.run]
source = ["themis_lgpd"]
omit = ["*/ui/*"]

[tool.bandit]
exclude_dirs = ["tests", "benchmark", ".venv"]
