name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Cache do modelo spaCy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/themis-modelo
          key: spacy-pt_core_news_lg-3.8.0
      - name: Instalar
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p ~/.cache/themis-modelo
          WHL=~/.cache/themis-modelo/pt_core_news_lg-3.8.0-py3-none-any.whl
          [ -f "$WHL" ] || curl -sSL -o "$WHL" https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl
          pip install "$WHL"
      - name: Lint
        run: ruff check src tests benchmark scripts
      - name: Análise de segurança do código
        run: bandit -q -r src -c pyproject.toml
      - name: Testes
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Trava de regressão — benchmark sintético (recall mínimo 99%)
        run: python benchmark/sintetico.py --n 400 --minimo 0.99
      - name: Trava de regressão — cobertura nacional, 27 UFs (recall e textos públicos preservados ≥ 99%)
        run: |
          python benchmark/nacional.py --n 540 --conjunto desenvolvimento --minimo 0.99 --preservacao-minima 0.99
          python benchmark/nacional.py --n 540 --conjunto validacao --minimo 0.99 --preservacao-minima 0.99
      - name: PDF/A-2b validado pelo veraPDF
        if: matrix.python == '3.12'
        run: |
          python scripts/validar_pdfa.py /tmp/pdfa
          arquivos=$(cd /tmp/pdfa && ls *.pdf | sed 's|^|/data/|')
          docker run --rm -v /tmp/pdfa:/data:ro \
            verapdf/cli:v1.30.4@sha256:f085855d442ad415e79fabbabcdd1803c2db4ee097cd5b94506c95ecdcfa1728 \
            --flavour 2b --format text $arquivos | tee /tmp/verapdf.txt
          if grep -q "^FAIL" /tmp/verapdf.txt; then exit 1; fi
          test "$(grep -c '^PASS' /tmp/verapdf.txt)" = "$(ls /tmp/pdfa/*.pdf | wc -l)"

  sistemas:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (OCR pelo RapidOCR, sem Tesseract)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pt_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl#sha256=2561c9a72a938d37141e9694e1a36d25061a44ce7e4f3bad2d3fa3bb836191af"
      - name: Testes
        run: pytest -q

  travadas:
    name: Testes (versões travadas da produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar exatamente requirements/producao.txt
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
          python -m pip install --upgrade pip
          pip install -r requirements/producao.txt
          pip install "pt_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl#sha256=2561c9a72a938d37141e9694e1a36d25061a44ce7e4f3bad2d3fa3bb836191af"
          pip install --no-deps -e .
          pip install pytest httpx faker segno
          pip check
      - name: Testes
        run: pytest -q -p no:cov -o addopts=""

  pacote:
    name: Pacote Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construir e validar (twine check)
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Instalar a roda num ambiente limpo e executar
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install -q dist/*.whl
          /tmp/limpo/bin/themis --versao
          echo "CPF 529.982.247-25" | /tmp/limpo/bin/themis anonimizar - --sem-ner | grep -q "\[CPF\]"

  dependencias:
    name: Dependências e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Vulnerabilidades conhecidas (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements/producao.txt
      - name: Segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir
        run: docker build -t themis-lgpd:ci .
      - name: Varredura de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: themis-lgpd:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Verificar que roda sem root e responde
        run: |
          test "$(docker run --rm --entrypoint id themis-lgpd:ci -u)" = "10001"
          docker run --rm themis-lgpd:ci --versao
      - name: Saúde do contêiner no modo API (HEALTHCHECK da imagem) e anonimização
        run: |
          docker run -d --name api --read-only --tmpfs /tmp --cap-drop ALL --health-interval 5s \
            -p 127.0.0.1:8000:8000 themis-lgpd:ci api --endereco 0.0.0.0
          for i in $(seq 1 60); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$estado" = healthy ] && break
            sleep 5
          done
          docker inspect --format 'saúde: {{.State.Health.Status}}' api
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy
          curl -sf http://127.0.0.1:8000/v1/anonimizar -H "Content-Type: application/json" \
            -d '{"texto": "Requerente com CPF 529.982.247-25"}' | grep -q "\[CPF\]"
          docker rm -f api
      - name: Tamanho da imagem
        run: |
          docker image inspect themis-lgpd:ci --format '{{.Size}}' \
            | awk '{printf "Tamanho da imagem: %.0f MB\n", $1 / 1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
