name: Publicação

# Numa tag vX.Y.Z: pacote Python (roda e sdist) com SBOM CycloneDX e atestado de proveniência SLSA,
# publicação no PyPI por publicação confiável (trusted publishing, sem token armazenado) e imagem no
# GHCR assinada com cosign (sem chave, pela identidade do workflow) e com atestado de proveniência.
# Em pull requests que alteram o empacotamento, tudo é executado como ensaio, sem publicar.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "Dockerfile"
      - "requirements/producao.txt"
      - "src/themis_lgpd/_versao.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/themis-lgpd

jobs:
  pacote:
    name: Pacote Python, SBOM e proveniência
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # atestado de proveniência (somente em tag)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: A tag confere com a versão do pacote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/themis_lgpd/_versao.py').read_text()).group(1))")
          if [ "v${versao}" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não corresponde à versão ${versao} do pacote." >&2
            exit 1
          fi
      - name: Construir e validar
        run: |
          python -m pip install --upgrade build twine cyclonedx-bom
          python -m build
          twine check --strict dist/*
      - name: SBOM (CycloneDX) do pacote com as dependências de produção
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install -q -r requirements/producao.txt dist/*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --output-format JSON --output-file dist/themis-lgpd.cdx.json
          python -c "import json; d = json.load(open('dist/themis-lgpd.cdx.json')); print(len(d['components']), 'componentes no SBOM')"
      - name: Atestado de proveniência (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  pypi:
    name: Publicação no PyPI
    needs: pacote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/themis-lgpd
    permissions:
      id-token: write       # publicação confiável: o PyPI confia na identidade deste workflow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Somente os pacotes (o SBOM acompanha a release no GitHub)
        run: rm -f dist/*.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  imagem:
    name: Imagem no GHCR, assinatura e proveniência
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # publicação no GHCR (somente em tag)
      id-token: write       # assinatura cosign sem chave e atestado de proveniência
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Entrar no GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: construcao
        name: Construir (e publicar, em tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: SBOM da imagem (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}@{1}', env.IMAGEM, steps.construcao.outputs.digest) || fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          artifact-name: themis-lgpd-imagem.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Assinar a imagem (cosign, sem chave)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.construcao.outputs.digest }}
        run: cosign sign --yes "${IMAGEM}@${DIGEST}"
      - name: Atestado de proveniência da imagem (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEM }}
          subject-digest: ${{ steps.construcao.outputs.digest }}
          push-to-registry: true
